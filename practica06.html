<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eso era amor</title>
</head>
<body>
    <h2><i>Eso era amor</i></h2>
    <p>Le comenté:</p>
    <p>-Me entusiasman tus ojos.</p>
    <p>Y ella dijo:</p>
    <p>-¿Te gustan solos o con rimel?</p>
    <p>-Grandes,</p>
    <p>respondí sin dudar.</p>
    <p>Y también sin dudar</p>
    <p>me los dejó en un plato y se fue a tientas.</p>
    <hr>
    <p align="right">Ángel González</p>
</body>
</html>
